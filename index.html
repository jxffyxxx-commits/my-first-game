<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>เกมแรกของฉัน</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      background: #1b1b2f;
    }
    canvas {
      background: #000;
      border: 2px solid #444;
    }
  </style>
</head>
<body>

  <canvas id="game" width="600" height="400"></canvas>

  <script>
    // หาพื้นที่วาดภาพ
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // วาดสี่เหลี่ยมสีฟ้า 1 อัน
    ctx.fillStyle = "#00d9ff";
    ctx.fillRect(50, 50, 80, 80);
  </script>

</body>
</html>
